  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#000; --surface:#111; --surface2:#1a1a1a; --border:#272727; --text:#e8e8e8; --text-dim:#999; --text-muted:#555; --white:#fff; --sidebar-w:110px; --topbar-h:60px; }

    .sidebar-btn { width:90px; height:67px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:none; border:none; color:#aaa; cursor:pointer; border-radius:10px; transition:background 0.15s,color 0.15s; font-family:'JetBrains Mono',monospace; font-size:15px; text-transform:lowercase; text-decoration:none; text-align:center; line-height:1.3; padding:0 4px; }
    .sidebar-btn:hover { background:var(--surface2); color:var(--white); }
    .sidebar-btn.active { color:var(--white); background:var(--surface2); }
    .sidebar-btn svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .page { margin-top:var(--topbar-h); margin-left:var(--sidebar-w); min-height:calc(100vh - var(--topbar-h)); padding:32px 28px 56px; background:var(--bg); }
    .page-title { font-size:1.4rem; font-weight:700; color:var(--white); margin-bottom:24px; letter-spacing:-0.5px; }
    .stream-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
    .stream-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer; transition:border-color 0.15s,transform 0.15s; text-decoration:none; display:block; }
    .stream-card:hover { border-color:#555; transform:translateY(-2px); }
    .stream-card img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }
    .stream-card h4 { padding:12px 14px; font-size:13px; font-weight:500; color:var(--text); line-height:1.5; }

  </nav>
</aside>
<main class="page">
  <h2 class="page-title">архив ярких моментов</h2>
  <div class="stream-grid" id="highlight-list"></div>
</main>
<script>
function extractTimestamp(p) { const m = p.match(/(\d+)/); return m ? parseInt(m[1],10) : 0; }
async function loadHighlights() {
  try {
    const r = await fetch("highlights/highlights.json");
    if (!r.ok) return [];
    let h = await r.json();
    h.sort((a,b) => extractTimestamp(a.chat_path) - extractTimestamp(b.chat_path));
    return h;
  } catch(e) { return []; }
}
let all = [], shown = 0;
const grid = document.getElementById("highlight-list");
function renderBatch() {
  const end = Math.min(shown + 10, all.length);
  for (let i = shown; i < end; i++) {
    const h = all[i];
    const card = document.createElement("a");
    card.className = "stream-card";
    card.href = "video.html?id=" + h.id;
    const p = "https://img.youtube.com/vi/" + h.id + "/hqdefault.jpg";
    card.innerHTML = '<img src="'+p+'" alt="'+(h.name||'')+'"><h4>'+(h.name||'без названия')+'</h4>';
    grid.appendChild(card);
  }
  shown = end;
  if (document.body.offsetHeight < window.innerHeight + 100 && shown < all.length) renderBatch();
}
async function init() {
  all = await loadHighlights();
  if (!all.length) { grid.innerHTML = "<p style='color:#555;padding:40px 0'>нет ярких моментов</p>"; return; }
  renderBatch();
  window.addEventListener("scroll", () => { if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) renderBatch(); });
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
