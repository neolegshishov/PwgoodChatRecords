<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pwgood Records - Архив ярких моментов</title>
  <link rel="icon" type="image/png" href="https://goood.pw/assets/top-hat.png">
  <style>
    /* Общий сброс и базовые стили */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background-color: #18181b; color: #ffffff; }
    header {
      background-color: #9147ff;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    header .logo { font-size: 1.8rem; font-weight: bold; }
    header nav {
      margin-left: 20px; display: flex; flex-wrap: wrap;
    }
    header nav a {
      margin-right: 15px; color: #fff; text-decoration: none; font-weight: bold;
      margin-top: 5px; margin-bottom: 5px;
    }
    /* Основной контейнер */
    .main-container { padding: 20px; }
    .main-container h2 { margin-bottom: 20px; }
    /* Сетка карточек; похожа на главную страницу */
    .stream-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
    .stream-card {
      background-color: #0e0e10;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
    }
    .stream-card img {
      width: 100%;
      border-radius: 8px;
    }
    .stream-card h4 { margin-top: 8px; font-size: 1.1rem; }
    /* Мобильные стили */
    @media (max-width:768px) {
      .main-container { padding: 10px; }
    }
  </style>
  <!-- Yandex.Metrika counter -->

    (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
    m[i].l=1*new Date();

      if(document.scripts[j].src===r){return;}
    }
    k=e.createElement(t),a=e.getElementsByTagName(t)[0],
    k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})

    <div><img src="https://mc.yandex.ru/watch/100982365" style="position:absolute; left:-9999px;" alt="" /></div>

<body>
  <header>
    <div class="logo">Pwgood Records</div>
    <nav>
      <a href="index.html">Главная</a>
      <a href="playlists.html">Плейлисты</a>
      <a href="search.html">Поиск</a>
      <a href="highlights.html">Архив ярких моментов</a>
    </nav>
  </header>
  <div class="main-container">
    <h2>Архив ярких моментов</h2>
    <div class="stream-list" id="highlight-list">
      <!-- Здесь будут динамически подгружаться карточки -->
    </div>
  </div>

  <script>
    // Функция извлечения числа (timestamp) из chat_path
    function extractTimestamp(chatPath) {
      const match = chatPath.match(/(\d+)/);
      return match ? parseInt(match[1], 10) : 0;
    }

    // Загрузка данных highlights из файла highlights/highlights.json
    async function loadHighlights() {
      try {
        const response = await fetch("highlights/highlights.json");
        if (!response.ok) {
          console.error("Ошибка загрузки highlights/highlights.json");
          return [];
        }
        let highlights = await response.json();
        // Сортируем от старых к новым (по возрастанию timestamp)
        highlights.sort((a, b) =>
          extractTimestamp(a.chat_path) - extractTimestamp(b.chat_path)
        );
        return highlights;
      } catch (error) {
        console.error("Ошибка загрузки highlights:", error);
        return [];
      }
    }

    // Переменные для организации бесконечного скролла
    let allHighlights = [];
    let displayedCount = 0;
    const batchSize = 10;
    const highlightListEl = document.getElementById("highlight-list");

    // Отрисовка очередной порции карточек
    function renderNextBatch() {
      if (!highlightListEl) return;
      const end = Math.min(displayedCount + batchSize, allHighlights.length);
      for (let i = displayedCount; i < end; i++) {
        const highlight = allHighlights[i];
        const card = document.createElement("div");
        card.classList.add("stream-card");
        // Формируем URL превью с YouTube по video id
        const previewUrl = `https://img.youtube.com/vi/${highlight.id}/hqdefault.jpg`;
        card.innerHTML = `
          <img src="${previewUrl}" alt="${highlight.name || 'Без названия'}">
          <h4>${highlight.name || 'Без названия'}</h4>
        `;
        // При клике переходим на страницу просмотра видео
        card.addEventListener("click", () => {
          window.location.href = `video.html?id=${highlight.id}`;
        });
        highlightListEl.appendChild(card);
      }
      displayedCount = end;

      // Если высота контента меньше высоты окна и еще есть записи для загрузки, подгружаем следующую партию
      if (document.body.offsetHeight < window.innerHeight + 100 && displayedCount < allHighlights.length) {
        renderNextBatch();
      }
    }


    // Инициализация страницы: загрузка данных и установка бесконечного скролла
    async function initHighlights() {
      allHighlights = await loadHighlights();
      if (!allHighlights || allHighlights.length === 0) {
        highlightListEl.innerHTML = "<p>Нет ярких моментов</p>";
        return;
      }
      renderNextBatch();
      window.addEventListener("scroll", () => {
        // Если пользователь приблизился к концу страницы, подгружаем следующую порцию
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 100) {
          renderNextBatch();
        }
      });
    }

    document.addEventListener("DOMContentLoaded", initHighlights);
  </script>
</body>
</html>
