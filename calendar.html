    <style>
        body {
            overflow-x: hidden;
        }

        .calendar-container {
            max-width: 1100px;
            margin: 20px auto;
            background: #0e0e10;
            padding: 20px;
            border-radius: 12px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-header button {
            background: #9147ff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }

        .calendar-header button:hover {
            background: #772fe3;
        }

        #monthTitle {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day-name {
            text-align: center;
            font-weight: bold;
            padding: 5px 0;
            color: #cfcfcf;
            font-size: 1rem;
        }

        .calendar-cell {
            min-height: 140px;
            background: #18181b;
            border-radius: 8px;
            padding: 8px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            border: 1px solid #222;
            overflow: hidden;
        }

        .calendar-cell.has-streams {
            border-color: #9147ff;
        }

        .calendar-cell .date {
            font-weight: bold;
            margin-bottom: 6px;
            color: #e0e0e0;
            font-size: 1rem;
        }

        .stream-entry {
            background: #202024;
            border-left: 3px solid #9147ff;
            padding: 4px 6px;
            margin-bottom: 5px;
            border-radius: 4px;
            font-size: 0.82rem;
            line-height: 1.15rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .stream-entry a {
            color: #c9a8ff;
            text-decoration: none;
        }

        .stream-entry a:hover {
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .calendar-grid {
                grid-template-columns: repeat(7, minmax(80px, 1fr));
            }
        }

        @media (max-width: 600px) {
            .calendar-grid {
                grid-template-columns: repeat(7, minmax(60px, 1fr));
            }
            .calendar-cell {
                padding: 5px;
            }
        }
    </style>

<body>
<header class="no-link-styles">
    <a class="logo" href="/PwgoodChatRecords">Pwgood Records</a>

<div class="calendar-container">
    <div class="calendar-header">
        <button id="prevMonth">←</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth">→</button>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
</div>

<script>
async function loadAllStreams() {
    let year = 2022;
    let all = [];

    while (true) {
        const url = `${year}/livestreams.json`;
        try {
            const r = await fetch(url);
            if (!r.ok) break;

            const arr = await r.json();
            if (Array.isArray(arr)) all = all.concat(arr);
        } catch {
            break;
        }
        year++;
    }

    return all;
}

function parseDate(name) {
    const m = name.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
    if (!m) return null;
    return new Date(+m[3], m[2] - 1, +m[1]);
}

function groupByDate(streams) {
    const map = {};

    for (const s of streams) {
        const d = parseDate(s.name);
        if (!d) continue;

        const key = d.toISOString().slice(0, 10);
        if (!map[key]) map[key] = [];
        map[key].push(s);
    }

    return map;
}

function renderCalendar(year, month, grouped) {
    const grid = document.getElementById("calendarGrid");
    const title = document.getElementById("monthTitle");

    grid.innerHTML = "";

    const monthNames = [
        "Январь","Февраль","Март","Апрель","Май","Июнь",
        "Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"
    ];

    title.textContent = `${monthNames[month]} ${year}`;

    const dayNames = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
    dayNames.forEach(d => {
        const el = document.createElement("div");
        el.className = "day-name";
        el.textContent = d;
        grid.appendChild(el);
    });

    const firstDay = new Date(year, month, 1);
    const startOffset = (firstDay.getDay() + 6) % 7;

    for (let i = 0; i < startOffset; i++) {
        const empty = document.createElement("div");
        grid.appendChild(empty);
    }

    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement("div");
        cell.className = "calendar-cell";

        const dateKey = new Date(year, month, day).toISOString().slice(0, 10);

        cell.innerHTML = `<div class="date">${day}</div>`;

        if (grouped[dateKey]) {
            cell.classList.add("has-streams");

            grouped[dateKey].forEach(stream => {
                const div = document.createElement("div");
                div.className = "stream-entry";

                const a = document.createElement("a");
                a.href = `/PwgoodChatRecords/video.html?id=${stream.id}`;
                a.target = "_blank";
                a.textContent = stream.name.replace(/^\d{1,2}\.\d{1,2}\.\d{4}\s*\|\s*/, "");

                div.appendChild(a);
                cell.appendChild(div);
            });
        }

        grid.appendChild(cell);
    }
}

(async function init() {
    const streams = await loadAllStreams();
    const grouped = groupByDate(streams);

    let current = new Date();
    let year = current.getFullYear();
    let month = current.getMonth();

    function update() {
        renderCalendar(year, month, grouped);
    }

    document.getElementById("prevMonth").onclick = () => {
        month--;
        if (month < 0) { month = 11; year--; }
        update();
    };

    document.getElementById("nextMonth").onclick = () => {
        month++;
        if (month > 11) { month = 0; year++; }
        update();
    };

    update();
})();
</script>

</body>
