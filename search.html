  <title>Pwgood Records - Поиск</title>
  <style>
    /* Общий сброс и базовые стили */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #18181b;
      color: #ffffff;
      line-height: 1.5;
    }
    header {
      background-color: #9147ff;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    header .logo {
      font-size: 1.8rem;
      font-weight: bold;
    }
    header nav {
      margin-left: 20px;
      display: flex;
      flex-wrap: wrap;
    }
    header nav a {
      margin-right: 15px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      margin-top: 5px;
      margin-bottom: 5px;
    }
    /* Контейнер поиска */
    .search-container {
      padding: 20px;
    }
    .search-head {
      margin-bottom: 20px;
      text-align: center;
    }
    .search-head h2 {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .search-options {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 10px;
    }
    .search-options label {
      font-size: 1rem;
      cursor: pointer;
    }
    .warning {
      text-align: center;
      background-color: #ffdddd;
      color: #a00;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      display: none;
    }
    .search-box {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .search-box input[type="text"] {
      width: 300px;
      padding: 8px;
      border-radius: 4px;
      border: none;
      font-size: 1rem;
    }
    .search-box button {
      padding: 8px 12px;
      background-color: #9147ff;
      border: none;
      color: #fff;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    /* Сетка с результатами */
    .results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
    .result-card {
      background-color: #0e0e10;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
    }
    .result-card img {
      width: 100%;
      border-radius: 8px;
    }
    .result-card h4 {
      margin-top: 8px;
      font-size: 1.1rem;
    }
    @media (max-width: 768px) {
      .search-box input[type="text"] {
        width: 100%;
      }
      .search-container {
        padding: 10px;
      }
    }
  </style>

<body>
  <header>
    <div class="logo">Pwgood Records</div>
    <nav>
      <a href="index.html">Главная</a>
      <a href="playlists.html">Плейлисты</a>
      <a href="search.html">Поиск</a>
      <a href="highlights.html">Архив ярких моментов</a>
    </nav>
  </header>

  <div class="search-container">
    <div class="search-head">
      <h2>Поиск</h2>
      <div class="search-options">
        <label>
          <input type="radio" name="searchType" value="title" checked>
          Поиск по названию видео
        </label>
        <label>
          <input type="radio" name="searchType" value="chat">
          Поиск в чате
        </label>
      </div>
    </div>
    <div class="warning" id="chat-warning">
      <p><strong>Внимание!</strong> Поиск в чате может занять очень много времени.</p>
    </div>
    <div class="search-box">
      <input type="text" id="search-query" placeholder="Введите запрос для поиска..." />
      <button id="search-button">Искать</button>
    </div>
    <div class="results" id="results">
      <!-- Здесь будут показаны результаты -->
    </div>
  </div>

  <script>
    // Получение GET-параметров (если потребуется)
    function getParameterByName(name, url = window.location.href) {
      name = name.replace(/[\[\]]/g, '\\$&');
      const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
            results = regex.exec(url);
      if (!results) return null;
      if (!results[2]) return '';
      return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    // Переключатель типа поиска – показываем предупреждение, если выбран поиск в чате.
    const radioButtons = document.getElementsByName("searchType");
    const chatWarning = document.getElementById("chat-warning");
    radioButtons.forEach(rb => {
      rb.addEventListener("change", () => {
        if (rb.value === "chat" && rb.checked) {
          chatWarning.style.display = "block";
        } else {
          chatWarning.style.display = "none";
        }
      });
    });

    const searchButton = document.getElementById("search-button");
    const searchQueryEl = document.getElementById("search-query");
    const resultsContainer = document.getElementById("results");

    // Функция отображения результатов (одинакова для обоих методов поиска)
    function displayResults(results) {
      resultsContainer.innerHTML = "";
      if (results.length === 0) {
        resultsContainer.innerHTML = "<p>Ничего не найдено</p>";
        return;
      }
      results.forEach(item => {
        const card = document.createElement("div");
        card.classList.add("result-card");
        // Превью с YouTube по video id
        const previewUrl = `https://img.youtube.com/vi/${item.id}/hqdefault.jpg`;
        card.innerHTML = `
          <img src="${previewUrl}" alt="${item.name || 'Без названия'}">
          <h4>${item.name || 'Без названия'}</h4>
        `;
        card.addEventListener("click", () => {
          window.location.href = `video.html?id=${item.id}`;
        });
        resultsContainer.appendChild(card);
      });
    }

    // Функция для загрузки всех видео (аналогичная логике главной страницы)
    async function loadAllVideos() {
      let allVideos = [];
      let currentYear = 2022;
      while (true) {
        const url = `${currentYear}/livestreams.json`;
        try {
          const response = await fetch(url);
          if (!response.ok) {
            break;
          }
          const data = await response.json();
          if (Array.isArray(data)) {
            allVideos = allVideos.concat(data);
          }
        } catch (error) {
          console.error(`Ошибка загрузки ${url}:`, error);
          break;
        }
        currentYear++;
      }
      return allVideos;
    }

    // Функция поиска по названию видео (обычный)
    async function searchByTitle(query) {
      const allVideos = await loadAllVideos();
      const results = allVideos.filter(video =>
        video.name.toLowerCase().includes(query.toLowerCase())
      );
      displayResults(results);
    }

    // Функция поиска в чате
    async function searchInChat(query) {
      // Предупреждение уже показано пользователю; дополнительно подтверждаем
      if (!confirm("Поиск в чате может занять очень много времени. Продолжить?")) {
        return;
      }
      const allVideos = await loadAllVideos();
      const matchingVideos = [];
      // Показываем сообщение о поиске, чтобы пользователь ждал
      resultsContainer.innerHTML = "<p>Идёт поиск в чатах. Пожалуйста, подождите...</p>";
      // Последовательно перебираем все видео и проверяем их чат
      for (const video of allVideos) {
        try {
          // Ожидаем fetch файла чата (путь хранится в video.chat_path)
          const resp = await fetch(video.chat_path);
          if (!resp.ok) continue;
          const chatText = await resp.text();
          // Если в содержимом чата встречается искомый запрос (без учёта регистра)
          if (chatText.toLowerCase().includes(query.toLowerCase())) {
            // Можно дополнительно извлечь фрагмент текста с совпадением, но пока просто добавляем видео.
            matchingVideos.push(video);
          }
        } catch (error) {
          console.error(`Ошибка загрузки чата ${video.chat_path}:`, error);
        }
      }
      displayResults(matchingVideos);
    }

    // Обработчик кнопки "Искать"
    searchButton.addEventListener("click", async () => {
      const query = searchQueryEl.value.trim();
      if (!query) {
        resultsContainer.innerHTML = "<p>Введите поисковый запрос</p>";
        return;
      }
      // Определяем тип поиска
      const searchType = document.querySelector('input[name="searchType"]:checked').value;
      if (searchType === "title") {
        await searchByTitle(query);
      } else if (searchType === "chat") {
        await searchInChat(query);
      }
    });
  </script>
</body>
</html>
