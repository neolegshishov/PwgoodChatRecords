  <style>
    /* Основная структура – на ПК: два столбца */
    .main-container {
      display: flex;
      flex-direction: row;
      padding: 20px;
      gap: 20px;
    }
    /* Левая колонка: видео и метаданные */
    .video-section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    /* Отзывчивый плеер */
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      overflow: hidden;
      width: 100%;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    /* Метаданные видео – небольшая часть под плеером */
    #video-metadata {
      margin-top: 10px;
      font-size: 0.9em;
    }
    /* Обновлённый контейнер чата */
    .chat-section {
      display: flex;
      flex-direction: column;
      width: 350px;
      background-color: #0e0e10;
      border-radius: 8px;
      /* Убираем внешние отступы внутри, чтобы контролы и чат располагались вплотную */
      padding: 0;
      max-height: 80vh;
      overflow: hidden;
    }

    /* Блок управления (кнопки) — фиксированная высота, не прокручивается */
    .chat-controls {
      padding: 10px;
      background-color: #9147ff;
      flex-shrink: 0;
    }

    /* Область с сообщениями — занимает оставшийся участок, имеет собственный скролл и выравнивание сообщений по нижней границе */
    .chat-content {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .chat-controls button {
      background-color: #9147ff;
      border: none;
      padding: 5px 10px;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }
    /* Мобильная версия: вертикальное расположение */
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        padding: 10px;
      }
      .video-section,
      #chat-section {
        width: 100%;
      }
      #chat-section {
        max-height: none;
      }
    }
  </style>

<body>
<header class="no-link-styles">
  <a class="logo" href="/PwgoodChatRecords">Pwgood Records</a>
  <nav>
    <a href="index.html">Главная</a>
    <a href="search.html">Поиск</a>
    <a href="highlights.html">Архив ярких моментов</a>
  </nav>
</header>

  <div class="main-container">
    <!-- Видео-секция (слева на ПК, сверху на моб.) -->
    <div class="video-section">
      <div id="player-container" class="video-container">
        <!-- Плеер будет вставлен в div#player -->
        <div id="player"></div>
      </div>
      <div id="video-metadata">
        <h2 id="video-title">Загружается...</h2>
        <p id="video-date"></p>
        <p id="video-description"></p>
      </div>
    </div>
    <!-- Чат-секция (справа на ПК, снизу на моб.) -->
    <div id="chat-section" class="chat-section">
      <div class="chat-controls">
        <button id="toggle-emojis">7tv emotes: включены</button>
        <button id="toggle-chat">Вкл/Выкл чат</button>
      </div>
      <div id="chat-content" class="chat-content">
        <p>Загрузка чата...</p>
      </div>
    </div>

  </div>

  <script>
    // --- Utility: получение GET-параметров из URL ---
    function getParameterByName(name, url = window.location.href) {
      name = name.replace(/[\[\]]/g, '\\$&');
      const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
            results = regex.exec(url);
      if (!results) return null;
      if (!results[2]) return '';
      return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    // --- Глобальные переменные для чата ---
    let player;
    const chatContent = document.getElementById("chat-content");
    let chatMessages = [];
    let startTime = 0;
    let emotes = {};
    let chatUpdateInterval;
    let emotesEnabled = true;

    // --- Функция прокрутки чата вниз ---
    function scrollToBottom() {
      chatContent.scrollTop = chatContent.scrollHeight;
    }

    // --- Функция для парсинга относительного времени (формат HH:MM:SS) ---
    function parseRelativeTime(relativeTime) {
      const parts = relativeTime.split(":").map(Number);
      return parts.reduce((acc, part) => acc * 60 + part, 0);
    }

    // --- Функция загрузки чата из файла ---
    async function loadChat(chatSrc) {
    chatContent.innerHTML = "<p>Загрузка чата...</p>";
    clearInterval(chatUpdateInterval);

    try {
        const response = await fetch(chatSrc);

        let chatText;

        if (chatSrc.endsWith(".gz")) {
            // --- GZIP ---
            const arrayBuffer = await response.arrayBuffer();
            const uint8 = new Uint8Array(arrayBuffer);
            const decompressed = pako.ungzip(uint8, { to: "string" });
            chatText = decompressed;
        } else {
            // --- Обычный текст ---
            chatText = await response.text();
        }

    const chatLines = chatText.split("\n");

    chatMessages = chatLines
      .map((line) => {
        const match = line.match(/\[([0-9:]+)\] (.+?): (.+)/);
        if (match) {
          return {
            time: parseRelativeTime(match[1]),
            rawTime: match[1],
            user: match[2],
            message: match[3]
          };
        }
        return null;
      })
      .filter(Boolean);

    if (chatMessages.length > 0) {
      startTime = chatMessages[0].time;
    } else {
      chatMessages = [{
        time: 0.0,
        rawTime: "0:00:00",
        user: "Система",
        message: "Не удалось загрузить чат!"
      }];
    }

    chatContent.innerHTML = "";
    scrollToBottom();

  } catch (error) {
    console.error("Ошибка загрузки чата:", error);
    chatContent.innerHTML = "<p>Ошибка загрузки чата</p>";
  }
}


    // --- Функция загрузки эмоций через 7tv; используется кеш ---
    const emoteCache = {};
    async function fetchEmotes() {
      if (Object.keys(emoteCache).length > 0) {
        emotes = emoteCache;
        return;
      }
      const query = `
        query EmoteSet {
          emoteSet(id: "01FQTMFVT00000QXHG0DRS80W1") {
            emotes {
              name
              data {
                host {
                  url
                }
              }
            }
          }
        }
      `;
      try {
        const response = await fetch("https://7tv.io/v3/gql", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ query })
        });
        const data = await response.json();
        data.data.emoteSet.emotes.forEach((emote) => {
          emotes[emote.name] = `https:${emote.data.host.url}/1x.webp`;
        });
        Object.assign(emoteCache, emotes);
      } catch (error) {
        console.error("Ошибка загрузки эмоций:", error);
      }
    }

    // --- Замена слов в сообщении на эмодзи (если включены) ---
    function replaceWithEmotes(message) {
      return message
        .split(" ")
        .map(word => (emotesEnabled && emotes[word])
          ? `<img title="${word}" src="${emotes[word]}" alt="${word}" class="emote">`
          : word)
        .join(" ");
    }

    // --- Цвет для пользователя (на основе его имени) ---
    function getUserColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      let color = '#';
      for (let i = 0; i < 3; i++) {
        const value = (hash >> (i * 8)) & 0xFF;
        color += value.toString(16).padStart(2, '0');
      }
      return color;
    }

    // --- Синхронизация отображения чата с воспроизведением видео ---
    function syncChatWithVideo(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        chatUpdateInterval = setInterval(() => {
          const currentTime = player.getCurrentTime();
          const visibleMessages = chatMessages
            .filter(msg => msg.time <= currentTime)
            .slice(-50);
          const existingMessages = Array.from(chatContent.children)
            .map(child => child.dataset.msgId);

          visibleMessages.forEach(msg => {
            if (!existingMessages.includes(msg.time.toString())) {
              const chatMessage = document.createElement("div");
              chatMessage.className = "chat-message";
              chatMessage.dataset.msgId = msg.time.toString();
              chatMessage.innerHTML = `<strong style="color: ${getUserColor(msg.user)}">${msg.user}:</strong> ${replaceWithEmotes(msg.message)}`;
              chatContent.appendChild(chatMessage);
            }
          });

          const extraMessages = Array.from(chatContent.children).filter(
            child => !visibleMessages.find(msg => msg.time.toString() === child.dataset.msgId)
          );
          extraMessages.forEach(msg => chatContent.removeChild(msg));
          scrollToBottom();
        }, 100);
      } else if (event.data === YT.PlayerState.PAUSED) {
        clearInterval(chatUpdateInterval);
      }
    }

    // --- Инициализация YouTube плеера через IFrame API ---
    function onYouTubeIframeAPIReady() {
      const videoId = getParameterByName('id');
      if (!videoId) {
        document.getElementById('player-container').innerHTML = "<p>Видео не найдено</p>";
        return;
      }
      player = new YT.Player('player', {
        videoId: videoId,
        events: {
          onReady: onPlayerReady,
          onStateChange: syncChatWithVideo
        },
        playerVars: { 'autoplay': 1 }
      });
    }

    async function findChatRecordByVideoId(videoId, startYear = 2022, endYear = new Date().getFullYear()) {
      for (let year = startYear; year <= endYear; year++) {
        const url = `${year}/livestreams.json`;
        try {
          const response = await fetch(url);
          if (!response.ok) {
            continue;
          }
          const records = await response.json();
          const found = records.find(record => record.id === videoId);
          if (found) {
            console.log(`Найдена запись в ${year}:`, found);
            return found;
          }
        } catch (error) {
          console.error(`Ошибка загрузки файла ${url}:`, error);
        }
      }
      return null;
    }

    function onPlayerReady(event) {
      // Получаем данные видео через IFrame API
      const videoData = player.getVideoData();
      document.getElementById('video-title').innerText = videoData.title;

      // Ищем запись чата по video id
      findChatRecordByVideoId(videoData.video_id).then(foundRecord => {
        if (foundRecord) {
          loadChat(foundRecord.chat_path);
          fetchEmotes();
        } else {
          document.getElementById('chat-content').innerHTML = "<p>Чат не найден</p>";
        }
      });
    }

    // --- Обработчики кнопок управления чатом ---
    const toggleEmojisButton = document.getElementById("toggle-emojis");
    toggleEmojisButton.addEventListener("click", () => {
      emotesEnabled = !emotesEnabled;
      toggleEmojisButton.textContent = `7tv emotes: ${emotesEnabled ? "включены" : "выключены"}`;
      chatContent.innerHTML = "";
      scrollToBottom();
    });

    document.getElementById('toggle-chat').addEventListener("click", () => {
      const chatContent = document.getElementById('chat-content');
      if (chatContent.style.display === "none" || chatContent.style.display === "") {
        chatContent.style.display = "block";
      } else {
        chatContent.style.display = "none";
      }
    });
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
