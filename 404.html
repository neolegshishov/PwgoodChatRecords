  <meta charset="UTF-8">

  <title>404 - Страница не найдена</title>
  <style>
    /* Общий сброс и базовые стили */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #18181b;
      color: #ffffff;
      overflow: hidden;
    }
    /* Контейнер по центру экрана */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      padding: 20px;
    }
    /* Стиль для надписи 404 с пульсацией */
    h1 {
      font-size: 6rem;
      margin: 0;
      color: #9147ff;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    /* Поясняющий текст */
    p {
      font-size: 1.5rem;
      margin: 20px 0;
    }
    /* Кнопка для возврата на главную */
    a {
      text-decoration: none;
      color: #ffffff;
      background-color: #9147ff;
      padding: 10px 20px;
      border-radius: 4px;
      transition: background-color 0.3s;
      font-size: 1rem;
    }
    a:hover {
      background-color: #7c34d8;
    }
    /* Анимированный элемент */
    .animation {
      position: relative;
      width: 150px;
      height: 150px;
      border: 5px solid #9147ff;
      border-radius: 50%;
      animation: rotate 4s linear infinite;
      margin-bottom: 40px;
    }
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animation::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70px;
      height: 70px;
      background-color: #9147ff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
    }
  </style>
