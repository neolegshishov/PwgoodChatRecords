<body>
<header class="no-link-styles">
    <a class="logo" href="/PwgoodChatRecords">Pwgood Records</a>
    <nav>
        <a href="index.html">Главная</a>

<div class="main-container">
    <main class="content">
        <h2>Последние трансляции</h2>
        <div class="stream-list">
        </div>
    </main>
</div>
<script>
    async function loadLivestreams() {
        const startYear = 2022;
        let currentYear = startYear;
        let allStreamData = [];

        // Пробуем загрузить файлы начиная с 2022 года, пока не встретим ошибку (например, 404)
        while (true) {
            const url = `${currentYear}/livestreams.json`;
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    console.log(`Файл ${url} не найден. Остановка загрузки.`);
                    break;
                }
                // JSON-файл представляет собой массив объектов
                const streams = await response.json();
                if (Array.isArray(streams)) {
                    allStreamData = allStreamData.concat(streams);
                }
            } catch (error) {
                console.error(`Ошибка при загрузке ${url}:`, error);
                break;
            }
            currentYear++;
        }

        // Функция для парсинга даты из названия видео (ожидается формат "ДД.ММ.ГГГГ")
        function parseDateFromName(name) {
            const m = name.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
            if (m) {
                const day = parseInt(m[1]);
                const month = parseInt(m[2]) - 1; // месяцы в JavaScript начинаются с 0
                const year = parseInt(m[3]);
                return new Date(year, month, day);
            }
            return new Date(0); // Если дата не распознана, возвращаем "очень старую" дату
        }

        // Сортируем записи от новых к старым
        allStreamData.sort((a, b) => {
            const dateA = parseDateFromName(a.name);
            const dateB = parseDateFromName(b.name);
            return dateB - dateA; // чем больше дата (новее), тем раньше в списке
        });

        // Организация пагинации: показываем батчами по 10 видео
        let displayedCount = 0;
        const batchSize = 10;
        const streamListEl = document.querySelector('.stream-list');

        function renderNextBatch() {
          if (!streamListEl) return;

          const end = Math.min(displayedCount + batchSize, allStreamData.length);
          for (let i = displayedCount; i < end; i++) {
            const stream = allStreamData[i];
            const card = document.createElement('div');
            card.classList.add('stream-card');

            // Формируем YouTube-превью
            const previewUrl = `https://img.youtube.com/vi/${stream.id}/hqdefault.jpg`;

            card.innerHTML = `
              <a href="https://youtube.com/watch?v=${stream.id}" target="_blank">
                  <img src="${previewUrl}" alt="${stream.name || 'Без названия'}">
              </a>
              <a href="/PwgoodChatRecords/video.html?id=${stream.id}" target="_blank" class="no-link-styles">
                  <h4>${stream.name || 'Без названия'}</h4>
              </a>
            `;
            streamListEl.appendChild(card);
          }
          displayedCount = end;

          // Если высота страницы меньше высоты окна (с небольшим запасом) и ещё есть данные, загружаем следующую партию
          if (document.body.offsetHeight < window.innerHeight + 100 && displayedCount < allStreamData.length) {
            renderNextBatch();
          }
        }



        // Отображаем первые 10 видео
        renderNextBatch();

        // Подгрузка следующей порции видео при прокрутке страницы (инфинити-скролл)
        window.addEventListener('scroll', () => {
            // Если пользователь приблизился к нижней границе страницы, подгружаем новые видео
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 100) {
                renderNextBatch();
            }
        });
    }

    document.addEventListener('DOMContentLoaded', loadLivestreams);
</script>


</body>
</html>
