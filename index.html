<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Видео и чат</title>
  <style>
    body {
      display: flex;
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #18181b;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    #container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    #video-list-container {
      width: 300px;
      background-color: #202024;
      border-right: 1px solid #2c2c2e;
      transition: transform 0.3s ease;
      overflow-y: auto;
    }

    #main-content {
      display: flex;
      flex-grow: 1;
    }

    #video-wrapper {
      flex-grow: 1;
      position: relative;
      background-color: black;
    }

    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #chat-wrapper {
      width: 30%; /* Фиксированная ширина чата */
      max-width: 30%;
      background-color: #18181b;
      display: flex;
      flex-direction: column-reverse; /* Сообщения снизу вверх */
      overflow-y: auto;
    }

    .chat-container {
      display: flex;
      flex-direction: column; /* Сообщения добавляются сверху вниз визуально */
      overflow-y: auto;
      padding: 10px;
    }

    #video-filter {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      background-color: #18181b;
    }

    #video-filter button {
      padding: 10px;
      background-color: #9147ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #video-filter button:hover {
      background-color: #772ce8;
    }

    .video-list {
      display: block;
      padding: 10px;
      background-color: #202024;
      overflow-y: auto;
      max-height: 400px;
    }

    .video-list.hidden {
      display: none;
    }

    #date-filter {
      display: block;
      margin: 10px 0;
      padding: 5px;
      background-color: #2c2c2e;
      color: white;
      border: none;
      border-radius: 5px;
    }

  </style>
</head>
<body>
  <div id="container">
    <div id="video-list-container">
      <button id="toggle-emotes">7tv emotes: включены</button>
      <div id="video-filter">
        <button id="highlights-btn">Яркие моменты</button>
        <button id="live-btn">Прямые трансляции</button>
      </div>
      <div id="highlight-videos" class="video-list">
        <h2>Яркие моменты</h2>
        <ul id="highlights">
          <!-- Список видео "Яркие моменты" -->
        </ul>
      </div>
      <div id="live-videos" class="video-list hidden">
        <h2>Прямые трансляции</h2>
        <ul id="livestreams">
          <li onclick="playVideo('4kEy3qJKzTI', 'https://api.github.com/repos/neolegshishov/PwgoodChatRecords/contents/2025/4/2421091760.txt')">
            01.04.2025 | 🎩 СТРИМ ГЛУПОСТЕЙ 🎩
          </li>
          <!-- Список видео "Прямые трансляции" -->
        </ul>
      </div>
    </div>

    <div id="main-content">
      <div id="video-wrapper">
        <div id="video"></div>
      </div>
      <div id="chat-wrapper">
        <div class="chat-container" id="chat-content">
          <p></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let player;
    const chatContent = document.getElementById("chat-content");
    let chatMessages = [];
    let startTime = 0;
    let emotes = {}; // Для хранения эмоций
    let chatUpdateInterval; // Для хранения ID интервала

    function playVideo(videoId, chatSrc) {
      if (player) {
        player.destroy();
      }
      player = new YT.Player("video", {
        videoId: videoId,
        events: {
          onReady: () => {
            loadChat(chatSrc);
            fetchEmotes();
          },
          onStateChange: syncChatWithVideo,
        },
      });
    }

    function scrollToBottom() {
      chatContent.scrollTop = chatContent.scrollHeight;
    }


    async function loadChat(chatSrc) {
      chatContent.innerHTML = "<p>Загрузка чата...</p>";
      try {
        const response = await fetch(chatSrc, {
          headers: {
            Accept: "application/vnd.github.v3.raw",
          },
        });
        const chatText = await response.text();
        const chatLines = chatText.split("\n");

        chatMessages = chatLines.map((line) => {
          const match = line.match(/\[(.+?) UTC\] (.+?): (.+)/);
          if (match) {
            return {
              time: new Date(match[1]).getTime() / 1000,
              user: match[2],
              message: match[3],
            };
          }
          return null;
        }).filter(Boolean);

        if (chatMessages.length > 0) {
          startTime = chatMessages[0].time;
          chatMessages.forEach((msg) => {
            msg.time -= startTime;
          });
        }
        chatContent.innerHTML = "";
        scrollToBottom(); // Прокручиваем вниз
      } catch (error) {
        chatContent.innerHTML = "<p>Не удалось загрузить чат.</p>";
      }
    }

    const emoteCache = {}; // Кеш для эмоций

    async function fetchEmotes() {
      if (Object.keys(emoteCache).length > 0) {
        emotes = emoteCache; // Берем из кеша, если он уже заполнен
        return;
      }

      const query = `
        query EmoteSet {
          emoteSet(id: "01FQTMFVT00000QXHG0DRS80W1") {
            emotes {
              name
              data {
                host {
                  url
                }
              }
            }
          }
        }
      `;
      try {
        const response = await fetch("https://7tv.io/v3/gql", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ query }),
        });
        const data = await response.json();
        data.data.emoteSet.emotes.forEach((emote) => {
          emotes[emote.name] = `https:${emote.data.host.url}/1x.webp`; // Ссылка на изображение эмоции
        });

        // Сохраняем эмоции в кеш
        Object.assign(emoteCache, emotes);
      } catch (error) {
        console.error("Ошибка загрузки эмоций:", error);
      }
    }


    function syncChatWithVideo(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        chatUpdateInterval = setInterval(() => {
          const currentTime = player.getCurrentTime();
          const visibleMessages = chatMessages
            .filter((msg) => msg.time <= currentTime)
            .slice(-50);

          const existingMessages = Array.from(chatContent.children).map((child) => child.dataset.msgId);

          visibleMessages.forEach((msg) => {
            if (!existingMessages.includes(msg.time.toString())) {
              const chatMessage = document.createElement("div");
              chatMessage.className = "chat-message";
              chatMessage.dataset.msgId = msg.time.toString(); // Уникальный идентификатор для сообщения
              chatMessage.innerHTML = `<strong style="color: ${getUserColor(msg.user)}">${msg.user}:</strong> ${replaceWithEmotes(
                msg.message
              )}`;
              chatContent.appendChild(chatMessage);
            }
          });

          // Удаляем лишние сообщения
          const extraMessages = Array.from(chatContent.children).filter(
            (child) => !visibleMessages.find((msg) => msg.time.toString() === child.dataset.msgId)
          );
          extraMessages.forEach((msg) => chatContent.removeChild(msg));
          scrollToBottom();
        }, 100);
      } else if (event.data === YT.PlayerState.PAUSED) {
        clearInterval(chatUpdateInterval);
      }
    }



    function replaceWithEmotes(message) {
      return message
        .split(" ")
        .map((word) => (emotesEnabled && emotes[word] ? `<img src="${emotes[word]}" alt="${word}" class="emote">` : word))
        .join(" ");
    }


    const getUserColor = (str) => {
      let hash = 0;
      str.split('').forEach(char => {
        hash = char.charCodeAt(0) + ((hash << 5) - hash)
      })
      let colour = '#'
      for (let i = 0; i < 3; i++) {
        const value = (hash >> (i * 8)) & 0xff
        colour += value.toString(16).padStart(2, '0')
      }
      return colour
    }

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName("script")[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    const toggleEmotesButton = document.getElementById("toggle-emotes");
    let emotesEnabled = true; // Флаг для отображения эмоций

    toggleEmotesButton.addEventListener("click", () => {
      emotesEnabled = !emotesEnabled;
      toggleEmotesButton.textContent = `7tv emotes: ${emotesEnabled ? "включены" : "выключены"}`;
    });


    const highlightsBtn = document.getElementById("highlights-btn");
    const liveBtn = document.getElementById("live-btn");
    const highlightVideos = document.getElementById("highlight-videos");
    const liveVideos = document.getElementById("live-videos");

    highlightsBtn.addEventListener("click", () => {
      highlightVideos.classList.remove("hidden");
      liveVideos.classList.add("hidden");
    });

    liveBtn.addEventListener("click", () => {
      highlightVideos.classList.add("hidden");
      liveVideos.classList.remove("hidden");
    });


  </script>
</body>
</html>
